[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team6-turboquant"
version = "0.2.0"
description = "Paper-faithful TurboQuant reference implementation and correctness gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
plots = [
  "matplotlib>=3.9",
]
hf = [
  "accelerate>=1.10",
  "transformers==5.20.2",
  "safetensors>=0.5",
]
score = [
  "rouge==1.0.1",
  "fuzzywuzzy==0.18.0",
  "jieba==0.42.1",
]

[project.scripts]
turboquant-validate = "turboquant.validation:main"
turboquant-g3 = "turboquant.gate:main"
turboquant-real-kv = "turboquant.real_kv:main"
turboquant-extract-kv = "turboquant.extract_kv:main"
turboquant-longbench = "turboquant.longbench:main"
turboquant-compare = "turboquant.compare:main"
turboquant-adaptive = "turboquant.adaptive:main"
turboquant-split = "turboquant.splits:main"
turboquant-context-report = "turboquant.context_report:main"
turboquant-score = "turboquant.scoring:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turboquant = ["data/*.json", "vendor/longbench/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
